name: Windows build and targeted tests

on:
  push:
    branches:
      - feature/letter-jump-on-open
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python for aqtinstall
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          # Qt 6.8 lacks the UTF-16 string concatenation used by the current sources.
          # 6.10.3 still uses the repository layout supported by aqtinstall 3.3.
          version: 6.10.3
          arch: win64_msvc2022_64
          archives: qtbase qtsvg qtdeclarative qttools
          setup-python: false
          cache: true

      - name: Backport Qt shared-QML cache path fix
        shell: pwsh
        run: |
          # Qt 6.12 normalizes parent directories before constructing cache filenames.
          $macrosPath = Join-Path $env:QT_ROOT_DIR 'lib/cmake/Qt6Qml/Qt6QmlMacros.cmake'
          $content = Get-Content -LiteralPath $macrosPath -Raw
          $before = 'string(REGEX REPLACE "[$#?]+" "_" compiled_file ${compiled_file})'
          if (([regex]::Matches($content, [regex]::Escape($before))).Count -ne 1) {
              throw "Unexpected Qt cache filename implementation"
          }
          $after = $before + "`n            " + 'string(REPLACE "../" "_" compiled_file "${compiled_file}")'
          Set-Content -LiteralPath $macrosPath -Value $content.Replace($before, $after) -NoNewline -Encoding utf8

      - name: Check ONNX Runtime package layout
        shell: pwsh
        run: cmake "-DTEST_DIR=$env:RUNNER_TEMP/onnxruntime-cmake" -P tests/cmake/tst_onnxruntime.cmake

      - name: Build and run touched tests
        shell: pwsh
        run: |
          $qmake = Get-Command qmake.exe -ErrorAction SilentlyContinue
          if (-not $qmake) {
              throw "qmake.exe was not added to PATH by the Qt setup action"
          }
          $qtDir = Split-Path (Split-Path $qmake.Source -Parent) -Parent
          & .\scripts\build.ps1 -QtDir $qtDir -Tests '^tst_(numberhints|idletrim|download_cmake|onnxruntime_cmake)$'
          if ($LASTEXITCODE) {
              throw "WinShun build or targeted tests failed"
          }
